# Ref: https://alacritty.org/config-alacritty.html

[general]
live_config_reload = true
import = [
  # uncomment the flavour you want below:
  # "~/.config/alacritty/plugins/catppuccin/catppuccin-latte.toml"
  "~/.config/alacritty/plugins/catppuccin/catppuccin-frappe.toml"
  # "~/.config/alacritty/plugins/catppuccin/catppuccin-macchiato.toml"
  # "~/.config/alacritty/plugins/catppuccin/catppuccin-mocha.toml"
]

[window]
dynamic_padding = true
decorations = "Full"
decorations_theme_variant = "Dark"
option_as_alt = "OnlyLeft"

[scrolling]
history = 60000

[font]
size = 13
offset = { x = 1, y = 5}
glyph_offset = { x = 0, y = 0 }
normal = { family = "Maple Mono NF CN", style = "Regular" }
bold = { family = "Maple Mono NF CN", style = "Medium" }

[cursor]
style = { shape = "Block", blinking = "Always" }
blink_interval = 600
blink_timeout = 0
unfocused_hollow = false
thickness = 0.6
