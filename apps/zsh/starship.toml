"$schema" = 'https://starship.rs/config-schema.json'

# Based on starship's own pure-preset, adjusted to match the pure prompt this
# config used before: path on its own line, git info in angle brackets after
# it, a bare prompt character below.

# starship computes the prompt synchronously, so every module it runs is time
# you wait before seeing anything. The default 500ms cap silently drops git
# status in a large repository -- in the linux kernel tree `git status` takes
# ~600ms, so the dirty marker would come and go depending on the disk cache,
# with nothing to tell you the prompt was incomplete. Raise it enough that the
# prompt is either right or visibly slow, never quietly wrong.
command_timeout = 2000
scan_timeout = 100

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
style = "blue"
truncation_length = 0
truncate_to_repo = false

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

# The opening bracket lives here and the closing one on git_status, which is
# always rendered even when clean, so the pair never goes unbalanced.
[git_branch]
format = "[‹$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218)($ahead_behind$stashed)›]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[hostname]
# Matches what pure did: only show the host when it is not the local machine.
# $HOST is not visible to starship, so a host that wants a friendlier name
# sets it here rather than in the shell.
ssh_only = true
format = "[@$hostname]($style) "
style = "bright-black"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []
